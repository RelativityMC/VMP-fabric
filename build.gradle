plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT'
	id 'maven-publish'
	id 'com.gradleup.shadow' version '9.2.1'
	id 'com.modrinth.minotaur' version '2.+'
	id 'io.github.themrmilchmann.curseforge-publish' version '0.8.0'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
	version = project.mod_version + "." + getVersionSuffix()
	group = project.maven_group
}

afterEvaluate {
	logger.lifecycle("Version String: ${version}")
	logger.lifecycle(com.ishland.vmp.buildscript.ParseGItHubActionChangelog.getChangelog())
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()
//	maven { url 'https://jitpack.io' }
	maven {
		url = "https://repo.codemc.io/repository/relativitymc/"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/vmp.accesswidener")

	useIntermediateMappings = true
	intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
}

repositories.named("Mojang", MavenArtifactRepository) {
	artifactUrls ArtifactRepositoryContainer.MAVEN_CENTRAL_URL
}

configurations {
	api.extendsFrom includeApi
	shadowInclude
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	include implementation("com.ibm.async:asyncutil:${async_util_version}")

	// Fabric API. This is technically optional, but you probably want it anyway.
	// modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
	// You may need to force-disable transitiveness on them.
}

afterEvaluate {
	migrateMappings.configure {
		outputDir = project.file("build/remappedSrc")
		doLast {
			copy {
				from project.file("build/remappedSrc")
				into project.file("src/main/java")
			}
		}
	}
}

processResources {
	inputs.property "version", project.version + "+" + project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version + "+" + project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE")
}

shadowJar {
	archiveClassifier = "all-dev"
	configurations = [ project.configurations.shadowInclude ]
	minimize()
	from("LICENSE")
	exclude "/raknetify*"
	relocate "com.ishland.raknetify", "com.ishland.vmp.deps.raknetify"
}

//noinspection UnnecessaryQualifiedReference
task("remapShadowJar", type: net.fabricmc.loom.task.RemapJarTask, dependsOn: shadowJar) {
	input = shadowJar.archiveFile
	archiveFileName = shadowJar.archiveFileName.get().replaceAll("-dev\\.jar\$", ".jar")
	addNestedDependencies = true
}

assemble.dependsOn(remapShadowJar)

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN") // This is the default. Remember to have the MODRINTH_TOKEN environment variable set or else this will fail, or set it to whatever you want - just make sure it stays private!
	projectId = "vmp-fabric" // This can be the project ID or the slug. Either will work!
	versionNumber = project.version + "+" + project.minecraft_version // You don't need to set this manually. Will fail if Modrinth has this version already
	versionName = project.version + " devbuild for " + project.minecraft_version
	versionType = "alpha" // This is the default -- can also be `beta` or `alpha`
	uploadFile = remapShadowJar // With Loom, this MUST be set to `remapJar` instead of `jar`!
	gameVersions = [project.minecraft_version] // Must be an array, even with only one version
	loaders = ["fabric"] // Must also be an array - no need to specify this if you're using Loom or ForgeGradle
	changelog = com.ishland.vmp.buildscript.ParseGItHubActionChangelog.getChangelog()
}

if (!project.minecraft_version.contains("w") && !project.minecraft_version.contains("-")) { // rough filter for snapshots
	curseforge {
		apiToken = System.getenv("CURSEFORGE_TOKEN")
		publications {
			register("main") {
				projectId = "552542"

				def matcher = java.util.regex.Pattern.compile("^([0-9]+)\\.([0-9]+)(?:\\.([0-9]+))?").matcher(project.minecraft_version)
				if (!matcher.find()) {
					throw new RuntimeException("version regex failed")
				}

				gameVersion("minecraft-" + matcher.group(1) + "-" + matcher.group(2), project.minecraft_version.replace('.', '-'))
				gameVersion("modloader", "fabric")
				gameVersion("java", "java-25")
				gameVersion("environment", "server")
				gameVersion("environment", "client")

				artifacts.register("main") {
					from(remapShadowJar)

					displayName = project.version + " devbuild for " + project.minecraft_version
					releaseType = io.github.themrmilchmann.gradle.publish.curseforge.ReleaseType.ALPHA

					changelog {
						format = io.github.themrmilchmann.gradle.publish.curseforge.ChangelogFormat.MARKDOWN
						from(com.ishland.vmp.buildscript.ParseGItHubActionChangelog.getChangelog())
					}
				}
			}
		}
	}
} else {
	tasks.register("publishMainPublicationToCurseForge") {
		doLast {
			logger.lifecycle("skipping curseforge publishing because snapshot")
		}
	}
}

String getVersionSuffix() {
	def stdout = providers.exec {
		commandLine 'git', 'describe', '--tags', '--dirty', '--broken'
	}.standardOutput.asText.get()
	stdout = stdout.toString().strip()
	def suffix = ""
	if (stdout.endsWith("-dirty")) {
		stdout = stdout.substring(0, stdout.length() - "-dirty".length())
		suffix = "-dirty"
	}
	if (stdout.endsWith("-broken")) {
		stdout = stdout.substring(0, stdout.length() - "-broken".length())
		suffix = "-broken"
	}
	if (stdout.indexOf('-') < 0) {
		return "0" + suffix;
	}
	def split = stdout.split('-')
	return split[split.length - 2] + suffix
}
