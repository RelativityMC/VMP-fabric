plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
	id 'maven-publish'
	id 'com.gradleup.shadow' version '9.2.1'
	id 'me.modmuss50.mod-publish-plugin' version "2.0.0-beta.2"
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
	version = project.mod_version + "." + getVersionSuffix()
	group = project.maven_group
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()
//	maven { url 'https://jitpack.io' }
	maven {
		url = "https://repo.codemc.io/repository/relativitymc/"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/vmp.accesswidener")

	useIntermediateMappings = true
	intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
}

configurations {
	api.extendsFrom includeApi
	shadowInclude
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	include implementation("com.ibm.async:asyncutil:${async_util_version}")

	// Fabric API. This is technically optional, but you probably want it anyway.
	// modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
	// You may need to force-disable transitiveness on them.
}

afterEvaluate {
	migrateMappings.configure {
		outputDir = project.file("build/remappedSrc")
		doLast {
			copy {
				from project.file("build/remappedSrc")
				into project.file("src/main/java")
			}
		}
	}
}

processResources {
	inputs.property "version", project.version + "+" + project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version + "+" + project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE")
}

shadowJar {
	archiveClassifier = "all-dev"
	configurations = [ project.configurations.shadowInclude ]
	minimize()
	from("LICENSE")
	exclude "/raknetify*"
	relocate "com.ishland.raknetify", "com.ishland.vmp.deps.raknetify"
}

//noinspection UnnecessaryQualifiedReference
def remapShadowJarProvider = tasks.register("remapShadowJar", net.fabricmc.loom.task.RemapJarTask) {
	input = shadowJar.archiveFile
	archiveFileName = shadowJar.archiveFileName.get().replaceAll("-dev\\.jar\$", ".jar")
	addNestedDependencies = true
	dependsOn(shadowJar)
}

loom.nestJars(remapShadowJarProvider, project.configurations.include)

assemble.dependsOn(remapShadowJar)

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def ghaChangelog = System.getenv("OVERRIDE_CHANGELOG")
if (ghaChangelog == null) {
	ghaChangelog = com.ishland.vmp.buildscript.ParseGItHubActionChangelog.getChangelog()
}

afterEvaluate {
	logger.lifecycle("Version String: ${version}")
	logger.lifecycle(ghaChangelog)
}

apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
	changelog = ghaChangelog
	modLoaders.add("fabric")

	def envDisplayName = System.getenv("OVERRIDE_DISPLAY_NAME")
	displayName = envDisplayName != null ? envDisplayName : (project.version + " devbuild for " + project.minecraft_version)

	def envType = System.getenv("OVERRIDE_RELEASE_TYPE")
	type = envType != null ? me.modmuss50.mpp.ReleaseType.valueOf(envType) : me.modmuss50.mpp.ReleaseType.ALPHA

	it.version = project.version + "+" + project.minecraft_version.replaceAll("-snapshot-", "-snap-")

	def cfVersions = project.curseforge_minecraft_versions.split(",")
	if (cfVersions.length != 0) {
		def cfOptions = curseforgeOptions {
			accessToken = System.getenv("CURSEFORGE_TOKEN")
			cfVersions.each { minecraftVersions.add(it.trim()) }
			client = true
			server = true
			changelogType = "markdown"
			javaVersions.add(JavaVersion.VERSION_25)
		}

		curseforge("curseforgeMITPackage") {
			from cfOptions
			file = remapShadowJar.archiveFile
			projectId = "552542"
		}
	}

	{
		def mrOptions = modrinthOptions {
			accessToken = System.getenv("MODRINTH_TOKEN")
			minecraftVersions.add(project.minecraft_version)
		}

		modrinth("modrinthMITPackage") {
			from mrOptions
			file = remapShadowJar.archiveFile
			projectId = "wnEe9KBa"
		}
	}
}

String getVersionSuffix() {
	def stdout = providers.exec {
		commandLine 'git', 'describe', '--tags', '--dirty', '--broken'
	}.standardOutput.asText.get()
	stdout = stdout.toString().strip()
	def suffix = ""
	if (stdout.endsWith("-dirty")) {
		stdout = stdout.substring(0, stdout.length() - "-dirty".length())
		suffix = "-dirty"
	}
	if (stdout.endsWith("-broken")) {
		stdout = stdout.substring(0, stdout.length() - "-broken".length())
		suffix = "-broken"
	}
	if (stdout.indexOf('-') < 0) {
		return "0" + suffix;
	}
	def split = stdout.split('-')
	return split[split.length - 2] + suffix
}
